name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go test -race ./...
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build -o /tmp/commandcode-bridge ./cmd/commandcode-bridge
