name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go test -race ./...
      - run: go vet ./...
      - name: Build
        env:
          VERSION: ci
          COMMIT: ${{ github.sha }}
          TARGETS: linux/amd64
          OUTDIR: /tmp/ccb-dist
        run: bash scripts/build-release.sh
